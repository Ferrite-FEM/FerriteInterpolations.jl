name: CI
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The test suite provisions Python + symfem through CondaPkg into
      # test/.conda_env (see test/runtests.jl); cache it on the CondaPkg.toml
      # contents to avoid re-downloading the environment every run.
      - uses: actions/cache@v4
        with:
          path: test/.conda_env
          key: conda-${{ runner.os }}-${{ hashFiles('test/CondaPkg.toml') }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
